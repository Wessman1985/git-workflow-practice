name: Secrets Demo

on:
  push:
    branches:
      - feature/github-secrets

permissions:
  contents: read

jobs:
  check-secret:
    name: Verify Secrets and Variables
    runs-on: ubuntu-latest

    steps:
      - name: Check that secret exists
        env:
          DEMO_API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: |
          if [ -n "$DEMO_API_KEY" ]; then
            echo "GitHub Secret is configured successfully!"
          else
            echo "::error::GitHub Secret is missing!"
            exit 1
          fi

      - name: Check application environment
        env:
          APP_ENV: ${{ vars.APP_ENV }}
        run: |
          if [ "$APP_ENV" = "development" ]; then
            echo "Application environment: $APP_ENV"
          else
            echo "::error::Unexpected application environment!"
            exit 1
          fi
